name: Windows installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Wisp.Client/package-lock.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Test backend
        run: dotnet test Wisp.slnx -c Release
      - name: Install client dependencies
        run: npm ci --prefix src/Wisp.Client --no-audit --no-fund
      - name: Test client
        run: npm --prefix src/Wisp.Client test
      - name: Lint client
        run: npm --prefix src/Wisp.Client run lint
      - name: Build installer
        run: ./tools/build-installer.ps1 -Version "0.1.$env:GITHUB_RUN_NUMBER"
      - name: Verify install, launch, upgrade and uninstall
        run: ./tools/test-installer.ps1 -Installer "artifacts/installers/Wisp-Setup-0.1.$env:GITHUB_RUN_NUMBER-win-x64.exe"
      - name: Upload installer and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Wisp-Setup-0.1.${{ github.run_number }}-win-x64
          path: artifacts/installers/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
