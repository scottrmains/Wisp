name: CI and Windows release

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  # Manual runs validate only. Re-run a main push run to retry a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.event_name }}-${{ github.ref }}
  # Never interrupt a main release halfway through publication/deployment.
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  validate-marketing:
    name: Validate marketing site
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
        working-directory: src/Wisp.Marketing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/Wisp.Marketing/package-lock.json
      - name: Install marketing dependencies
        run: npm ci --no-audit --no-fund
      - name: Test release selection
        run: npm test
      - name: Build static marketing site
        run: npm run build
      - name: Install marketing test browser
        run: npx playwright install chromium
      - name: Test marketing layout and download states
        run: npm run test:browser

  validate:
    name: Validate
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/Wisp.Client/package-lock.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - name: Test dependency download recovery
        run: ./tools/test-dependency-downloads.ps1
      - name: Cache verified FFmpeg archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/dependencies/ffmpeg-*-essentials_build.zip
          key: ffmpeg-win-x64-v1-${{ hashFiles('tools/ffmpeg-dependency.json') }}
      - name: Prepare FFmpeg for isolated audio tests
        run: ./tools/get-ffmpeg.ps1
      - name: Test backend
        run: |
          $env:WISP_TEST_FFMPEG = (Resolve-Path tools/ffmpeg/ffmpeg.exe).Path
          dotnet test Wisp.slnx -c Release
      - name: Install client dependencies
        run: npm ci --prefix src/Wisp.Client --no-audit --no-fund
      - name: Test client
        run: npm --prefix src/Wisp.Client test
      - name: Lint client
        run: npm --prefix src/Wisp.Client run lint
      - name: Build client
        run: npm --prefix src/Wisp.Client run build
      - name: Install browser for drag regression tests
        working-directory: src/Wisp.Client
        run: npx playwright install chromium
      - name: Test desktop drag UI (isolated mock bridge)
        run: npm --prefix src/Wisp.Client run test:browser
      - name: Test warmed-cache application upgrade
        run: node tools/test-ui-upgrade-cache.mjs --app src/Wisp.Api/bin/Release/net10.0/Wisp.dll --web-root src/Wisp.Api/wwwroot --data-root artifacts/ui-upgrade-cache

  installer:
    name: Production installer
    needs: [validate, validate-marketing]
    # Neither PRs (including develop -> main), develop pushes nor manual runs
    # may package/upload an executable. main is the production release boundary.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/Wisp.Client/package-lock.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - name: Cache verified FFmpeg archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/dependencies/ffmpeg-*-essentials_build.zip
          key: ffmpeg-win-x64-v1-${{ hashFiles('tools/ffmpeg-dependency.json') }}
      - name: Build installer
        run: ./tools/build-installer.ps1 -Version "0.1.$env:GITHUB_RUN_NUMBER"
      - name: Install browser for installed upgrade-cache test
        working-directory: src/Wisp.Client
        run: npx playwright install chromium
      - name: Verify install, launch, upgrade and uninstall
        run: ./tools/test-installer.ps1 -Installer "artifacts/installers/Wisp-Setup-0.1.$env:GITHUB_RUN_NUMBER-win-x64.exe"
      - name: Upload installer and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Wisp-Setup-0.1.${{ github.run_number }}-win-x64
          path: artifacts/installers/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  release:
    name: Publish verified Windows release
    needs: installer
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/Wisp.Marketing/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Wisp-Setup-0.1.${{ github.run_number }}-win-x64
          path: artifacts/installers
      - name: Publish only verified, current-main installer assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node src/Wisp.Marketing/scripts/publish-release.mjs artifacts/installers
      - name: Verify anonymous public download and checksum
        run: node src/Wisp.Marketing/scripts/verify-production.mjs artifacts/release-manifest.json
      - name: Build homepage with baked-in public download
        working-directory: src/Wisp.Marketing
        env:
          WISP_RELEASE_MANIFEST: ${{ github.workspace }}/artifacts/release-manifest.json
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Upload exact production website
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wisp-production-site
          path: src/Wisp.Marketing/dist
          if-no-files-found: error
          retention-days: 30

  deploy-marketing:
    name: Deploy production homepage
    needs: release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.WISP_SITE_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wisp-production-site
          path: src/Wisp.Marketing/dist
      - name: Refuse obsolete main deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e 'import { productionContext, assertCurrentMain, githubApi } from "./src/Wisp.Marketing/scripts/production.mjs"; await assertCurrentMain(githubApi(process.env.GH_TOKEN), productionContext(process.env).commit);'
      - name: Azure login with production-only federated identity
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: cc92b3bb-5fae-425c-b1a5-5aefea8ba6b1
          subscription-id: fa9dfca3-f9c4-4859-a0c8-665c59380a3d
      - name: Deploy only WISP Static Web App
        env:
          WISP_SITE_URL: ${{ vars.WISP_SITE_URL }}
        run: |
          set -euo pipefail
          target=$(az staticwebapp show --name wisp-web-prod --resource-group rg-wisp-prod --query defaultHostname -o tsv)
          test "https://$target" = "$WISP_SITE_URL"
          token=$(az staticwebapp secrets list --name wisp-web-prod --resource-group rg-wisp-prod --query properties.apiKey -o tsv)
          test -n "$token"
          echo "::add-mask::$token"
          export SWA_CLI_DEPLOYMENT_TOKEN="$token"
          npx --yes @azure/static-web-apps-cli@2.0.10 deploy src/Wisp.Marketing/dist --env production
          unset SWA_CLI_DEPLOYMENT_TOKEN token
      - name: Verify deployed commit, download link and site assets
        env:
          WISP_SITE_URL: ${{ vars.WISP_SITE_URL }}
        run: node src/Wisp.Marketing/scripts/verify-production.mjs src/Wisp.Marketing/dist/release.json "$WISP_SITE_URL"
